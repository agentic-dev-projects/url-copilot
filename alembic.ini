[alembic]
# Path to the migration scripts directory
script_location = service/db/migrations

# Prepend cwd to sys.path so that service.* imports resolve in env.py
prepend_sys_path = .

# Naming convention for auto-generated migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

version_path_separator = os

# Database URL is intentionally omitted here.
# env.py reads it from service.config.settings so secrets stay out of VCS.


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
